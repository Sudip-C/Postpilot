name: Bug report
description: Report a reproducible problem in PostPilot
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API keys, OAuth secrets, access tokens, private logs, or production credentials.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
      placeholder: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only sanitized logs. Remove all secrets and personal data.
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - NVIDIA / AI generation
        - Content strategy / validation
        - Supabase / database
        - LinkedIn OAuth
        - LinkedIn publishing
        - GitHub Actions / scheduling
        - Vercel / deployment
        - API / authentication
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 22.x

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Windows 11 local, Vercel production

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed all secrets, tokens, credentials, and private data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
